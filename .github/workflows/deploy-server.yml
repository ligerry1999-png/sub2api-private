name: Deploy Server

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Load the prebuilt image on the server and restart Sub2API"
        required: true
        default: false
        type: boolean
      migration_rehearsal_sha:
        description: "For deploy=true, enter the exact commit SHA that passed the restored-database rehearsal"
        required: false
        default: ""
        type: string

concurrency:
  group: sub2api-server-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CHATGPT2API_INTERNAL_BRIDGE_KEY: ${{ secrets.CHATGPT2API_INTERNAL_BRIDGE_KEY }}
      MIGRATION_REHEARSAL_SHA: ${{ inputs.migration_rehearsal_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deploy secrets
        if: ${{ inputs.deploy == true }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "deploy=true is allowed only from the main branch"
            exit 1
          }
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is required"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is required"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is required"; exit 1; }
          test -n "$CHATGPT2API_INTERNAL_BRIDGE_KEY" || { echo "CHATGPT2API_INTERNAL_BRIDGE_KEY is required"; exit 1; }
          test "$MIGRATION_REHEARSAL_SHA" = "$GITHUB_SHA" || {
            echo "migration_rehearsal_sha must equal the exact deployed commit: $GITHUB_SHA"
            exit 1
          }

      - name: Configure SSH
        if: ${{ inputs.deploy == true }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build Docker image
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "VERSION=$VERSION_VALUE" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --build-arg "DATE=$BUILD_DATE" \
            -t "sub2api:private-${GITHUB_SHA}" .
          BUILD_INFO="$(docker run --rm "sub2api:private-${GITHUB_SHA}" /app/sub2api -version 2>&1)"
          printf '%s\n' "$BUILD_INFO"
          printf '%s\n' "$BUILD_INFO" | grep -F "Sub2API ${VERSION_VALUE}"
          printf '%s\n' "$BUILD_INFO" | grep -F "commit: ${GITHUB_SHA}"
          if [ "${{ inputs.deploy }}" = "true" ]; then
            docker save "sub2api:private-${GITHUB_SHA}" | gzip > "/tmp/sub2api-image-${GITHUB_SHA}.tar.gz"
          fi

      - name: Upload release and image bundles
        if: ${{ inputs.deploy == true }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          BUNDLE="/tmp/sub2api-release-${GITHUB_SHA}.tgz"
          IMAGE_BUNDLE="/tmp/sub2api-image-${GITHUB_SHA}.tar.gz"
          printf '%s\n' "$GITHUB_SHA" > .release-commit
          tar --exclude='.git' -czf "$BUNDLE" .
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" "$BUNDLE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sub2api-release.tgz"
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" "$IMAGE_BUNDLE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sub2api-image.tgz"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          RELEASE_DIR="/opt/sub2api-release"
          NEXT_DIR="/opt/sub2api-release.next"
          PREV_DIR="/opt/sub2api-release.prev"

          rm -rf "$NEXT_DIR"
          mkdir -p "$NEXT_DIR"
          tar -xzf /tmp/sub2api-release.tgz -C "$NEXT_DIR"
          rm -f /tmp/sub2api-release.tgz

          rm -rf "$PREV_DIR"
          if [ -d "$RELEASE_DIR" ]; then
            mv "$RELEASE_DIR" "$PREV_DIR"
          fi
          mv "$NEXT_DIR" "$RELEASE_DIR"
          REMOTE

      - name: Deploy Sub2API
        if: ${{ inputs.deploy == true }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          BRIDGE_KEY_B64="$(printf '%s' "$CHATGPT2API_INTERNAL_BRIDGE_KEY" | base64 -w 0)"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "BRIDGE_KEY_B64='$BRIDGE_KEY_B64' RELEASE_SHA='$GITHUB_SHA' timeout 40m bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="/opt/sub2api-release"
          DEPLOY_DIR="$REPO_DIR/deploy/tanzhongyu"
          RUNTIME_DIR="/opt/sub2api-src/deploy/tanzhongyu"
          BRIDGE_KEY="$(printf '%s' "$BRIDGE_KEY_B64" | base64 -d)"

          upsert_env() {
            file="$1"
            key="$2"
            value="$3"
            touch "$file"
            escaped_value="$(printf '%s' "$value" | sed -e 's/[\/&]/\\&/g')"
            if grep -q "^${key}=" "$file"; then
              sed -i "s/^${key}=.*/${key}=${escaped_value}/" "$file"
            else
              printf '%s=%s\n' "$key" "$value" >> "$file"
            fi
          }

          mkdir -p "$RUNTIME_DIR/data" "$RUNTIME_DIR/postgres_data" "$RUNTIME_DIR/redis_data" "$RUNTIME_DIR/backups"
          if [ ! -f "$RUNTIME_DIR/.env" ]; then
            cp "$DEPLOY_DIR/.env.example" "$RUNTIME_DIR/.env"
          fi

          upsert_env "$RUNTIME_DIR/.env" "SUB2API_DATA_DIR" "$RUNTIME_DIR/data"
          upsert_env "$RUNTIME_DIR/.env" "SUB2API_POSTGRES_DATA_DIR" "$RUNTIME_DIR/postgres_data"
          upsert_env "$RUNTIME_DIR/.env" "SUB2API_REDIS_DATA_DIR" "$RUNTIME_DIR/redis_data"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_IMAGE_WORKER_ENABLED" "false"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_IMAGE_WORKER_BASE_URL" "http://chatgpt2api:80/internal/v1"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_IMAGE_WORKER_TOKEN" "$BRIDGE_KEY"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_IMAGE_WORKER_FALLBACK_ENABLED" "true"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_RESPONSE_HEADER_TIMEOUT" "1200"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT" "0"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_IMAGE_WORKER_TIMEOUT_SECONDS" "1200"
          upsert_env "$RUNTIME_DIR/.env" "IMAGE_LOGS_CLEANUP_ENABLED" "true"
          upsert_env "$RUNTIME_DIR/.env" "IMAGE_LOGS_RETENTION_DAYS" "7"
          upsert_env "$RUNTIME_DIR/.env" "IMAGE_LOGS_CLEANUP_INTERVAL_SECONDS" "3600"
          upsert_env "$RUNTIME_DIR/.env" "IMAGE_LOGS_CLEANUP_BATCH_SIZE" "500"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_ENABLED" "true"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_MAX_PENDING_TASKS" "2000"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_MAX_PENDING_BYTES" "5368709120"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_WORKER_CEILING" "64"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_MAX_ATTEMPTS" "8"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_RETRY_BASE_SECONDS" "3"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_RETRY_MAX_SECONDS" "60"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_LEASE_TTL_SECONDS" "2100"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_STALE_AFTER_SECONDS" "2400"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_READY_KEY" "image_jobs:queue:ready"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_DELAYED_KEY" "image_jobs:queue:delayed"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_ACTIVE_KEY" "image_jobs:queue:active"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_PAUSE_KEY" "image_jobs:queue:paused"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_INFLIGHT_KEY_PREFIX" "image_jobs:queue:inflight:"
          upsert_env "$RUNTIME_DIR/.env" "GATEWAY_ASYNC_IMAGE_QUEUE_IDEMPOTENCY_KEY_PREFIX" "image_jobs:queue:idem:"
          sed -i '/^ASYNC_IMAGE_MAX_CONCURRENT=/d' "$RUNTIME_DIR/.env"
          upsert_env "$RUNTIME_DIR/.env" "IMAGE_JOBS_RETENTION_DAYS" "2"
          upsert_env "$RUNTIME_DIR/.env" "CHATGPT2API_IMAGES_RETENTION_DAYS" "3"

          cd "$DEPLOY_DIR"

          IMAGE_QUEUE_PAUSE_KEY="$(grep '^GATEWAY_ASYNC_IMAGE_QUEUE_PAUSE_KEY=' "$RUNTIME_DIR/.env" | tail -n 1 | cut -d= -f2-)"
          test -n "$IMAGE_QUEUE_PAUSE_KEY"
          queue_pause_set=false

          pause_image_queue() {
            pause_result="$(docker exec sub2api-private-redis redis-cli SET "$IMAGE_QUEUE_PAUSE_KEY" "$RELEASE_SHA" EX 3600)"
            queue_pause_set=true
            test "$pause_result" = "OK"
            echo "Paused image-job dequeue; new submissions remain queued"
          }

          resume_image_queue() {
            if [ "$queue_pause_set" = "true" ]; then
              docker exec sub2api-private-redis redis-cli DEL "$IMAGE_QUEUE_PAUSE_KEY" >/dev/null || true
              queue_pause_set=false
              echo "Resumed image-job dequeue"
            fi
          }

          resume_queue_on_pre_restart_failure() {
            exit_code="$?"
            trap - ERR
            resume_image_queue
            exit "$exit_code"
          }
          trap resume_queue_on_pre_restart_failure ERR

          pause_image_queue

          wait_for_running_image_jobs() {
            jobs_root="$RUNTIME_DIR/data/image_jobs"
            if [ ! -d "$jobs_root" ]; then
              echo "No image job directory found; continuing deployment"
              return 0
            fi
            pending_jobs="$({ find "$jobs_root" -name meta.json -type f -exec \
              grep -lE '"status"[[:space:]]*:[[:space:]]*"pending"' {} + 2>/dev/null || true; } | wc -l | tr -d ' ')"
            echo "Preserving ${pending_jobs} pending image job(s) for recovery after restart"
            idle_checks=0
            for attempt in $(seq 1 120); do
              running_jobs="$({ find "$jobs_root" -name meta.json -type f -exec \
                grep -lE '"status"[[:space:]]*:[[:space:]]*"running"' {} + 2>/dev/null || true; } | wc -l | tr -d ' ')"
              if [ "$running_jobs" = "0" ]; then
                idle_checks=$((idle_checks + 1))
                if [ "$idle_checks" -ge 2 ]; then
                  echo "No image jobs are running; continuing deployment with pending jobs preserved"
                  return 0
                fi
              else
                idle_checks=0
                echo "Waiting for ${running_jobs} running image job(s) before restart"
              fi
              sleep 15
            done
            echo "Timed out waiting for running image jobs; deployment stopped before restart"
            return 1
          }

          create_verified_postgres_backup() {
            backup_stamp="$(date -u '+%Y%m%dT%H%M%SZ')"
            backup_file="$RUNTIME_DIR/backups/postgres-${backup_stamp}-${RELEASE_SHA}.dump"
            backup_tmp="${backup_file}.tmp"
            checksum_file="${backup_file}.sha256"

            if ! docker inspect -f '{{.State.Running}}' sub2api-private-postgres 2>/dev/null | grep -qx true; then
              echo "PostgreSQL container is not running; deployment stopped before restart"
              return 1
            fi

            rm -f "$backup_tmp"
            docker exec sub2api-private-postgres sh -ec \
              'exec pg_dump --format=custom --create --no-owner --no-privileges -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              > "$backup_tmp"
            test -s "$backup_tmp" || {
              echo "PostgreSQL backup is empty; deployment stopped before restart"
              rm -f "$backup_tmp"
              return 1
            }
            docker exec -i sub2api-private-postgres sh -ec 'pg_restore --list >/dev/null' < "$backup_tmp"
            mv "$backup_tmp" "$backup_file"
            sha256sum "$backup_file" > "$checksum_file"
            chmod 600 "$backup_file" "$checksum_file"
            POSTGRES_BACKUP_FILE="$backup_file"
            export POSTGRES_BACKUP_FILE
            echo "Verified PostgreSQL backup: $POSTGRES_BACKUP_FILE"
          }

          wait_for_running_image_jobs
          create_verified_postgres_backup

          previous_image="$(docker inspect -f '{{.Config.Image}}' sub2api-private 2>/dev/null || true)"
          if [ -z "$previous_image" ]; then
            previous_image="$(grep '^SUB2API_IMAGE=' "$RUNTIME_DIR/.env" | tail -n 1 | cut -d= -f2- || true)"
          fi
          if [ -z "$previous_image" ]; then
            previous_image="sub2api:private-prod"
          fi
          rollback_available=false
          rollback_image="sub2api:private-prev-${RELEASE_SHA}"
          if docker image inspect "$previous_image" >/dev/null 2>&1; then
            docker tag "$previous_image" "$rollback_image"
            rollback_available=true
          fi

          rollback_sub2api() {
            exit_code="$?"
            trap - ERR
            resume_image_queue
            if [ "$rollback_available" = "true" ]; then
              echo "Deployment failed; restoring the rehearsal-verified previous image..."
              upsert_env "$RUNTIME_DIR/.env" "SUB2API_IMAGE" "$rollback_image"
              docker compose --env-file "$RUNTIME_DIR/.env" -p tanzhongyu -f docker-compose.yml up -d --force-recreate sub2api || true
              for rollback_attempt in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
                  echo "Previous Sub2API image restored"
                  break
                fi
                sleep 2
              done
            fi
            echo "Database backup retained at: ${POSTGRES_BACKUP_FILE:-unknown}"
            exit "$exit_code"
          }
          trap rollback_sub2api ERR

          echo "Loading prebuilt Sub2API image..."
          docker load -i /tmp/sub2api-image.tgz
          rm -f /tmp/sub2api-image.tgz
          next_image="sub2api:private-${RELEASE_SHA}"
          docker image inspect "$next_image" >/dev/null
          upsert_env "$RUNTIME_DIR/.env" "SUB2API_IMAGE" "$next_image"
          docker compose --env-file "$RUNTIME_DIR/.env" -p tanzhongyu -f docker-compose.yml up -d --no-build sub2api

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Sub2API health check failed"
              docker logs --tail 120 sub2api-private || true
              false
            fi
            sleep 2
          done

          echo "Sub2API health check passed"

          container_health=""
          for health_attempt in $(seq 1 45); do
            container_health="$(docker inspect --format '{{.State.Health.Status}}' sub2api-private 2>/dev/null || true)"
            if [ "$container_health" = "healthy" ]; then
              break
            fi
            if [ "$container_health" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          test "$container_health" = "healthy" || {
            echo "Sub2API container is not healthy: ${container_health:-unknown}"
            false
          }
          resume_image_queue

          expected_version="$(tr -d '\r\n' < "$REPO_DIR/backend/cmd/server/VERSION")"
          test "$(tr -d '\r\n' < "$REPO_DIR/.release-commit")" = "$RELEASE_SHA"
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "sub2api:private-${RELEASE_SHA}")"
          test "$image_revision" = "$RELEASE_SHA"
          build_info="$(docker exec sub2api-private /app/sub2api -version 2>&1)"
          printf '%s\n' "$build_info"
          printf '%s\n' "$build_info" | grep -F "Sub2API ${expected_version}"
          printf '%s\n' "$build_info" | grep -F "commit: ${RELEASE_SHA}"

          probe_custom_route() {
            method="$1"
            path="$2"
            expected_status="$3"
            body="${4:-}"
            out="/tmp/sub2api-route-probe.out"
            if [ "$method" = "POST" ]; then
              status="$(curl -sS -o "$out" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" "http://127.0.0.1:18080${path}" || true)"
            else
              status="$(curl -sS -o "$out" -w '%{http_code}' "http://127.0.0.1:18080${path}" || true)"
            fi
            if [ "$status" != "$expected_status" ]; then
              echo "Custom route probe failed: ${method} ${path} status=${status}, expected=${expected_status}"
              head -c 500 "$out" || true
              exit 1
            fi
            echo "Custom route probe passed: ${method} ${path} status=${status}"
          }

          probe_custom_route POST /v1/image-jobs/images/generations 401 '{"model":"gpt-image-2","prompt":"probe"}'
          probe_custom_route POST /v1/image-jobs/images/edits 401 '{"model":"gpt-image-2","prompt":"probe"}'
          probe_custom_route GET /v1/image-jobs/imgjob_probe 401
          probe_custom_route GET /v1/image-jobs/imgjob_probe/result 401
          probe_custom_route POST /v1/image-jobs/imgjob_probe/cancel 401

          if command -v nginx >/dev/null 2>&1; then
            cp "$DEPLOY_DIR/nginx-sub2api-prod.conf" /etc/nginx/sites-available/sub2api
            if [ -f /etc/nginx/sites-available/sub2api-preview ]; then
              cp "$DEPLOY_DIR/nginx-sub2api-preview-8443.conf" /etc/nginx/sites-available/sub2api-preview
            fi
            nginx -t
            systemctl reload nginx
          fi

          install -m 0755 "$DEPLOY_DIR/storage-cleanup.sh" "$RUNTIME_DIR/storage-cleanup.sh"
          if command -v systemctl >/dev/null 2>&1; then
            cat > /etc/systemd/system/sub2api-storage-cleanup.service <<SERVICE
          [Unit]
          Description=Sub2API storage cleanup

          [Service]
          Type=oneshot
          Nice=10
          IOSchedulingClass=idle
          ExecStart=$RUNTIME_DIR/storage-cleanup.sh
          SERVICE
            cat > /etc/systemd/system/sub2api-storage-cleanup.timer <<'TIMER'
          [Unit]
          Description=Run Sub2API storage cleanup hourly

          [Timer]
          OnCalendar=hourly
          Persistent=true

          [Install]
          WantedBy=timers.target
          TIMER
            systemctl daemon-reload
            systemctl enable --now sub2api-storage-cleanup.timer
          fi

          trap - ERR
          echo "Database backup retained at: $POSTGRES_BACKUP_FILE"
          docker image prune -f >/dev/null || true
          docker compose --env-file "$RUNTIME_DIR/.env" -p tanzhongyu -f docker-compose.yml ps
          REMOTE
