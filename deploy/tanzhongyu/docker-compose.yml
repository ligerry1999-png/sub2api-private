services:
  sub2api:
    image: ${SUB2API_IMAGE:-weishaw/sub2api:latest}
    container_name: sub2api-private
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-18080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SUB2API_DATA_DIR:-./data}:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - RUN_MODE=${RUN_MODE:-standard}
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - SECURITY_URL_ALLOWLIST_ENABLED=${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      - GATEWAY_FORCE_CODEX_CLI=${GATEWAY_FORCE_CODEX_CLI:-true}
      - GATEWAY_RESPONSE_HEADER_TIMEOUT=${GATEWAY_RESPONSE_HEADER_TIMEOUT:-1200}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_WORKER_ENABLED=${GATEWAY_IMAGE_WORKER_ENABLED:-false}
      - GATEWAY_IMAGE_WORKER_BASE_URL=${GATEWAY_IMAGE_WORKER_BASE_URL:-}
      - GATEWAY_IMAGE_WORKER_TOKEN=${GATEWAY_IMAGE_WORKER_TOKEN:-}
      - GATEWAY_IMAGE_WORKER_FALLBACK_ENABLED=${GATEWAY_IMAGE_WORKER_FALLBACK_ENABLED:-true}
      - GATEWAY_IMAGE_WORKER_TIMEOUT_SECONDS=${GATEWAY_IMAGE_WORKER_TIMEOUT_SECONDS:-1200}
      - IMAGE_LOGS_CLEANUP_ENABLED=${IMAGE_LOGS_CLEANUP_ENABLED:-true}
      - IMAGE_LOGS_RETENTION_DAYS=${IMAGE_LOGS_RETENTION_DAYS:-30}
      - IMAGE_LOGS_CLEANUP_INTERVAL_SECONDS=${IMAGE_LOGS_CLEANUP_INTERVAL_SECONDS:-3600}
      - IMAGE_LOGS_CLEANUP_BATCH_SIZE=${IMAGE_LOGS_CLEANUP_BATCH_SIZE:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-private-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-private-postgres
    restart: unless-stopped
    volumes:
      - ${SUB2API_POSTGRES_DATA_DIR:-./postgres_data}:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sub2api-private-network

  redis:
    image: redis:8-alpine
    container_name: sub2api-private-redis
    restart: unless-stopped
    volumes:
      - ${SUB2API_REDIS_DATA_DIR:-./redis_data}:/data
    command: >
      sh -c 'redis-server --save 60 1 --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sub2api-private-network

networks:
  sub2api-private-network:
    driver: bridge
